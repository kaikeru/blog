{{ define "main" }}
<h1 class="list-title">{{ .Title }}</h1>
{{ if eq .Kind "term" }}
{{ partial "notes.html" (.Paginate .Pages) }}
{{ else }}
<ul class="tag-index">
    {{ range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">~{{ .Page.Title }}</a> <span class="count">({{ .Count }})</span></li>
    {{ end }}
</ul>
{{ end }}
{{ end }}
