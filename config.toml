# Description : The config for Hugo using the kaikeru theme.
# Author      : Kyle Wagner

baseURL = "https://kaikeru.com/"
locale = "en-us"
title = "kaikeru"
theme = "kaikeru"
copyright = "©️2020 - 2026 Kyle Wagner"
enableRobotsTXT = true
capitalizeListTitles = false

# Tags only; no categories.
[taxonomies]
  tag = "tags"

[author]
  name = "Kyle Wagner"

[params]
  author = "Kyle Wagner"
  description = "Blog"
  goodreadsShelf = "https://www.goodreads.com/review/list_rss/38312672?shelf=currently-reading"

[[menu.main]]
  identifier = "entries"
  url = "/"
  name = "Entries"
  weight = 1

[[menu.main]]
  identifier = "resume"
  url = "/resume/"
  name = "Resume"
  weight = 2

[[menu.main]]
  identifier = "reading-list"
  url = "/reading-list/"
  name = "Reading List"
  weight = 3

# Social links shown under the main menu.

[[menu.social]]
  url = "https://github.com/kaikeru/"
  name = "Github"
  weight = 1

[[menu.social]]
  url = "https://www.goodreads.com/user/show/38312672-kyle"
  name = "Goodreads"
  weight = 2

[[menu.social]]
    url = "https://www.linkedin.com/in/kaikeru/"
    name = "Linkedin"
    weight = 3

# Posts contain raw HTML written by the author.
[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "onedark"

[pagination]
  pagerSize = 24


# Re-fetch remote resources (the Goodreads feed) at most hourly in local rebuilds.
[caches.getresource]
  maxAge = "1h"
