# Description : The config for Hugo using the kaikeru theme.
# Author      : Kyle Wagner

baseURL = "https://kaikeru.com/"
locale = "en-us"
title = "kaikeru"
theme = "kaikeru"
copyright = "©️2020 - 2026 Kyle Wagner"
enableRobotsTXT = true

[author]
  name = "Kyle Wagner"

[params]
  author = "Kyle Wagner"
  description = "Blog"

[[menu.main]]
  identifier = "entries"
  url = "/"
  name = "Entries"
  weight = 1

[[menu.main]]
  identifier = "resume"
  url = "/resume/"
  name = "Resume"
  weight = 2

[[menu.main]]
  identifier = "reading-list"
  url = "/reading-list/"
  name = "Reading List"
  weight = 3

# Social links shown under the main menu.

[[menu.social]]
  url = "https://github.com/kaikeru/"
  name = "Github"
  weight = 1

[[menu.social]]
    url = "https://www.linkedin.com/in/kaikeru/"
    name = "Linkedin"
    weight = 3

# Posts contain raw HTML written by the author.
[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "onedark"

[pagination]
  pagerSize = 24

